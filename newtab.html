<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>New Tab</title>
  <style>
    :root {
      --bg: #fbfbfd;
      --surface: #ffffff;
      --surface-hover: rgba(20, 16, 40, 0.05);
      --border: rgba(20, 16, 40, 0.10);
      --text: #1d1b24;
      --text-dim: rgba(29, 27, 36, 0.62);
      --text-faint: rgba(29, 27, 36, 0.40);
      --accent: #6d5bd0;
      --accent-soft: rgba(109, 91, 208, 0.14);
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1d23;
        --surface: #2a2930;
        --surface-hover: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.1);
        --text: #f1f0f5;
        --text-dim: rgba(241, 240, 245, 0.62);
        --text-faint: rgba(241, 240, 245, 0.4);
        --accent: #a99bff;
        --accent-soft: rgba(169, 155, 255, 0.18);
      }
      .tile-icon img[src*="github"] { filter: invert(1); }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(109, 91, 208, 0.07), transparent 60%),
        var(--bg);
    }

    main {
      width: min(640px, calc(100vw - 48px));
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -6vh;
      animation: rise 500ms var(--ease) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    #clock {
      font-size: clamp(56px, 11vw, 96px);
      font-weight: 200;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      user-select: none;
    }

    #date {
      margin-top: 10px;
      color: var(--text-dim);
      font-size: 15px;
      user-select: none;
    }

    form {
      width: 100%;
      margin-top: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 52px;
      padding: 0 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: border-color 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    form:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft), 0 12px 40px rgba(20, 16, 40, 0.10);
    }
    form svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--text-faint);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    #search {
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font: inherit;
      font-size: 16px;
    }
    #search::placeholder { color: var(--text-faint); }

    #links {
      margin-top: 44px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
    }
    @media (max-width: 520px) { #links { grid-template-columns: repeat(3, 1fr); } }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px 8px 14px;
      border-radius: 14px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12.5px;
      transition: background 160ms var(--ease), color 160ms var(--ease), transform 160ms var(--ease);
    }
    .tile:hover { background: var(--surface-hover); color: var(--text); transform: translateY(-2px); }
    .tile:active { transform: none; }

    .tile-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }
    .tile-icon img { width: 24px; height: 24px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <div id="clock">--:--</div>
    <div id="date"></div>

    <form id="search-form" autocomplete="off">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Search the web or type a URL" spellcheck="false" />
    </form>

    <nav id="links"></nav>
  </main>

  <script>
    const QUICK_LINKS = [
      { name: 'YouTube', url: 'https://www.youtube.com', domain: 'youtube.com' },
      { name: 'GitHub', url: 'https://github.com', domain: 'github.com' },
      { name: 'Reddit', url: 'https://www.reddit.com', domain: 'reddit.com' },
      { name: 'ChatGPT', url: 'https://chatgpt.com', domain: 'chatgpt.com' },
      { name: 'X', url: 'https://x.com', domain: 'x.com' },
      { name: 'Wikipedia', url: 'https://www.wikipedia.org', domain: 'wikipedia.org' },
      { name: 'Gmail', url: 'https://mail.google.com', domain: 'mail.google.com' },
      { name: 'Hacker News', url: 'https://news.ycombinator.com', domain: 'news.ycombinator.com' },
    ];

    const linksEl = document.getElementById('links');
    for (const link of QUICK_LINKS) {
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = link.url;

      const icon = document.createElement('span');
      icon.className = 'tile-icon';
      const img = document.createElement('img');
      img.alt = '';
      img.src = `https://icons.duckduckgo.com/ip3/${link.domain}.ico`;
      img.addEventListener('error', () => { icon.textContent = link.name[0]; }, { once: true });
      icon.appendChild(img);

      const label = document.createElement('span');
      label.textContent = link.name;

      a.append(icon, label);
      linksEl.appendChild(a);
    }

    // Live clock
    const clockEl = document.getElementById('clock');
    const dateEl = document.getElementById('date');
    function tick() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      dateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    }
    tick();
    setInterval(tick, 1000);

    // Search: domains open directly, everything else goes to DuckDuckGo
    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = document.getElementById('search').value.trim();
      if (!text) return;
      let url;
      if (/^[a-z][a-z\d+\-.]*:\/\//i.test(text)) url = text;
      else if (/^(localhost|\d{1,3}(\.\d{1,3}){3})(:\d+)?([/?#].*)?$/i.test(text)) url = 'http://' + text;
      else if (!/\s/.test(text) && /^([a-z\d]([a-z\d-]*[a-z\d])?\.)+[a-z]{2,63}(:\d+)?([/?#].*)?$/i.test(text)) url = 'https://' + text;
      else url = 'https://duckduckgo.com/?q=' + encodeURIComponent(text);
      window.location.href = url;
    });
  </script>
</body>
</html>
