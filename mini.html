<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="mini">
  <header id="mini-bar">
    <form id="mini-omnibox" autocomplete="off">
      <span id="mini-icon"></span>
      <input id="mini-url" type="text" spellcheck="false" placeholder="Search or enter address" />
    </form>
    <button id="mini-promote" class="mini-promote" title="Open in main window">
      <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      <span>Open in Browser</span>
    </button>
  </header>
  <main id="mini-content"></main>
  <script src="mini.js"></script>
</body>
</html>
